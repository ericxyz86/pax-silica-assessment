# Origin cache policy for pax-silica.aiailabs.net — committed here so the serving
# behaviour is versioned with the site it serves.
#
# The site is a living document. Before this, no Cache-Control was sent at all, so
# browsers applied heuristic freshness and returning visitors could see stale pages
# for a long window after a deploy (observed during carousel debugging: a browser
# reused a 40-minute-old index.html across four deploys).
#
# no-cache does NOT mean "don't cache": nginx still sends ETag/Last-Modified, so a
# revalidation for an unchanged file answers 304 with no body. What it removes is
# the silent freshness window.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # the page, its data files, and the generated report: revalidate every load
    location ~* \.(html|json|pdf)$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # heavy media and code: an hour, then revalidate
    location ~* \.(mp3|png|jpg|jpeg|webp|svg|js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
