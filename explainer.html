<style>
  :root {
    /* Agile Intelligence — DESIGN.md §3 */
    --navy:#061B3A; --deep:#0B4F9C; --bright:#0096D6; --cyan:#00B8CC;
    --ink:#FFFFFF; --line:rgba(255,255,255,0.12);
    /* §7 — one easing curve for the whole piece */
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--navy);
    display:flex; align-items:center; justify-content:center;
    padding:clamp(12px,3vw,24px); }
  /* capped by height as well as width so the 16:9 stage always fits the
     1100x660 modal frame the parent page opens it in */
  #frame { width:min(1120px, 100%, calc((100vh - clamp(24px,6vw,48px)) * 16 / 9)); }
  #stage { position:relative; width:100%; aspect-ratio:16/9;
    background:var(--navy);
    border-radius:12px; overflow:hidden; border:1px solid var(--line);
    box-shadow:0 24px 40px -16px rgba(11,79,156,.22), 0 8px 16px -8px rgba(14,23,38,.10); }
  video { display:block; width:100%; height:100%; background:var(--navy); }
  #poster { position:absolute; inset:0; width:100%; height:100%; border:0; cursor:pointer;
    background:rgba(4,16,34,0.35); display:flex; align-items:center; justify-content:center;
    transition:opacity .35s var(--ease); }
  #poster.gone { opacity:0; pointer-events:none; }
  #poster span { display:flex; align-items:center; justify-content:center;
    width:clamp(64px,9vw,84px); height:clamp(64px,9vw,84px); border-radius:999px;
    background:rgba(0,184,204,0.18); border:1.5px solid rgba(0,184,204,0.75); color:var(--cyan);
    backdrop-filter:blur(4px); transition:background .25s var(--ease), color .25s var(--ease); }
  #poster:hover span { background:var(--cyan); color:var(--navy); }
  #poster svg { width:38%; height:38%; fill:currentColor; margin-left:6%; }
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <video id="vid" controls playsinline preload="metadata"
      poster="assets/explainer-preview.png"
      src="assets/pax-silica-explainer.mp4"></video>
    <button id="poster" aria-label="Panoorin ang explainer">
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></span>
    </button>
  </div>
</div>
<script>
(function(){
"use strict";
var v = document.getElementById("vid");
var poster = document.getElementById("poster");
/* Analytics lifecycle: bounded events to the parent bridge, nothing more. Fires at most
   once per name per page load; a standalone visit posts to itself where no listener exists,
   which is harmless. Same contract the audio explainer used. */
var AN = { started:false, m25:false, m50:false, m75:false, done:false };
function anEmit(ev, pct){ try { window.parent.postMessage(
  pct === undefined ? { source:"pax-silica-explainer", event:ev }
                    : { source:"pax-silica-explainer", event:ev, percent:pct }, location.origin);
} catch(_) {} }
poster.addEventListener("click", function(){ v.play(); });
v.addEventListener("play", function(){
  poster.classList.add("gone");
  if (!AN.started){ AN.started = true; anEmit("explainer_start"); }
});
v.addEventListener("timeupdate", function(){
  if (!v.duration) return;
  var pc = v.currentTime / v.duration * 100;
  if (!AN.m25 && pc >= 25){ AN.m25 = true; anEmit("explainer_progress", 25); }
  if (!AN.m50 && pc >= 50){ AN.m50 = true; anEmit("explainer_progress", 50); }
  if (!AN.m75 && pc >= 75){ AN.m75 = true; anEmit("explainer_progress", 75); }
});
v.addEventListener("ended", function(){
  if (!AN.done){ AN.done = true; anEmit("explainer_complete"); }
});
})();
</script>
</body>
